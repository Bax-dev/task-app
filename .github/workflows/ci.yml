name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock --include=optional

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Package build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tar -czf build-output.tar.gz .next

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 1
          path: build-output.tar.gz

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Pre-flight on EC2 (clean leftovers, ensure paths)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 ec2-user@${{ secrets.EC2_HOST }} '
            set -e
            echo "==> Disk usage:"
            df -h /
            echo "==> Removing any leftover deploy artifacts..."
            sudo rm -rf /home/ec2-user/build-output.tar.gz /home/ec2-user/build-output.tar.gz.* /home/ec2-user/nginx-taskflow.conf /home/ec2-user/nginx-taskflow.conf.* 2>/dev/null || true
            mkdir -p ~/task-app
          '

      - name: Upload and extract build on EC2
        env:
          REMOTE_TMP: /home/ec2-user/build-output.tar.gz.${{ github.run_id }}
          REMOTE_FINAL: /home/ec2-user/build-output.tar.gz
        run: |
          set -euo pipefail
          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 build-output.tar.gz ec2-user@${{ secrets.EC2_HOST }}:"$REMOTE_TMP"
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 ec2-user@${{ secrets.EC2_HOST }} "
            set -e
            mv '$REMOTE_TMP' '$REMOTE_FINAL'
            mkdir -p ~/task-app
            cd ~/task-app
            rm -rf .next
            tar -xzf '$REMOTE_FINAL'
            rm -f '$REMOTE_FINAL'
          "

      - name: Sync Nginx config
        env:
          REMOTE_TMP: /home/ec2-user/nginx-taskflow.conf.${{ github.run_id }}
          REMOTE_FINAL: /home/ec2-user/nginx-taskflow.conf
        run: |
          set -euo pipefail
          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 deploy/nginx-taskflow.conf ec2-user@${{ secrets.EC2_HOST }}:"$REMOTE_TMP"
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 ec2-user@${{ secrets.EC2_HOST }} "
            set -e
            mv '$REMOTE_TMP' '$REMOTE_FINAL'
            sudo cp '$REMOTE_FINAL' /etc/nginx/conf.d/taskflow.conf
            rm -f '$REMOTE_FINAL'
            sudo nginx -t
            sudo systemctl reload nginx
          "

      - name: EC2 diagnostics (on failure)
        if: failure()
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 ec2-user@${{ secrets.EC2_HOST }} '
            echo "==> df -h /"
            df -h /
            echo "==> ls -la /home/ec2-user/"
            ls -la /home/ec2-user/ | head -50
            echo "==> ls -la ~/task-app (head)"
            ls -la ~/task-app 2>/dev/null | head -30 || echo "(no ~/task-app)"
            echo "==> nginx status (last 20 lines)"
            sudo systemctl status nginx --no-pager -n 20 || true
            echo "==> pm2 status"
            pm2 status 2>/dev/null || true
          ' || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          TASKFLOW_CRON_SECRET: ${{ secrets.TASKFLOW_CRON_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          envs: DATABASE_URL,JWT_SECRET,REDIS_URL,RESEND_API_KEY,EMAIL_FROM,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_GOOGLE_CLIENT_ID,TASKFLOW_CRON_SECRET,GH_PAT
          script: |
            REPO_URL="https://${GH_PAT}@github.com/Bax-dev/task-app.git"

            if [ ! -d ~/task-app ]; then
              echo "==> Cloning repository..."
              git clone "$REPO_URL" ~/task-app
            fi

            cd ~/task-app

            echo "==> Configuring git remote with token..."
            git remote set-url origin "$REPO_URL"

            echo "==> Pulling latest code..."
            git stash 2>/dev/null || true
            git pull origin main

            echo "==> Writing .env file..."
            printf 'DATABASE_URL="%s"\nJWT_SECRET="%s"\nRESEND_API_KEY="%s"\nEMAIL_FROM="%s"\nREDIS_URL="%s"\nAWS_REGION="%s"\nAWS_ACCESS_KEY_ID="%s"\nAWS_SECRET_ACCESS_KEY="%s"\nAWS_S3_BUCKET="%s"\nGOOGLE_CLIENT_ID="%s"\nGOOGLE_CLIENT_SECRET="%s"\nNEXT_PUBLIC_APP_URL="%s"\nNEXT_PUBLIC_GOOGLE_CLIENT_ID="%s"\nTASKFLOW_CRON_SECRET="%s"\nNODE_ENV="production"\n' "${DATABASE_URL}" "${JWT_SECRET}" "${RESEND_API_KEY}" "${EMAIL_FROM}" "${REDIS_URL}" "${AWS_REGION}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" "${AWS_S3_BUCKET}" "${GOOGLE_CLIENT_ID}" "${GOOGLE_CLIENT_SECRET}" "${NEXT_PUBLIC_APP_URL}" "${NEXT_PUBLIC_GOOGLE_CLIENT_ID}" "${TASKFLOW_CRON_SECRET}" > .env

            echo "==> Configuring AWS credentials for Bedrock..."
            mkdir -p ~/.aws
            printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\nregion = %s\n' "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" "${AWS_REGION}" > ~/.aws/credentials
            printf '[default]\nregion = %s\noutput = json\n' "${AWS_REGION}" > ~/.aws/config

            if [ -z "$DATABASE_URL" ]; then
              echo "ERROR: DATABASE_URL is not set."
              exit 1
            fi

            echo "==> Installing production dependencies..."
            npm install --no-package-lock --omit=dev --include=optional

            echo "==> Generating Prisma client..."
            npx prisma generate

            echo "==> Running database migrations..."
            npx prisma migrate deploy

            echo "==> Restarting application..."
            pm2 delete taskflow 2>/dev/null || true
            pm2 start ecosystem.config.js

            echo "==> Saving PM2 process list..."
            pm2 save

            echo "==> Setting up reminder cron job..."
            sudo yum install -y cronie 2>/dev/null || true
            sudo systemctl enable crond --now 2>/dev/null || true
            (crontab -l 2>/dev/null | grep -v 'daily-reports/reminders'; echo "* * * * * curl -s -X POST ${NEXT_PUBLIC_APP_URL}/api/daily-reports/reminders -H 'x-taskflow-cron-secret: ${TASKFLOW_CRON_SECRET}' >> /var/log/reminder-cron.log 2>&1") | crontab -

            echo "==> Deploy complete!"
