name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock --include=optional
      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: npx prisma generate
      - run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: npx prisma generate
      - run: npm test

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${REGISTRY:?ECR registry was not resolved (amazon-ecr-login output empty)}"
          : "${REPO:?ECR_REPOSITORY secret is not set}"
          : "${TAG:?github.sha is empty}"
          IMAGE="$REGISTRY/$REPO:$TAG"
          echo "Building $IMAGE"
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
            -t "$IMAGE" \
            -t "$REGISTRY/$REPO:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$REPO:latest"

  deploy:
    name: Deploy to Fargate
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.build-and-push.result == 'success'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Register new task definition
        id: task-def
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
          CONTAINER_NAME: app
          TASK_FAMILY: ${{ secrets.ECS_TASK_DEFINITION }}
        run: |
          set -euo pipefail
          : "${REGISTRY:?ECR registry was not resolved (amazon-ecr-login output empty)}"
          : "${REPO:?ECR_REPOSITORY secret is not set}"
          : "${TAG:?github.sha is empty}"
          : "${TASK_FAMILY:?ECS_TASK_DEFINITION secret is not set}"
          IMAGE="$REGISTRY/$REPO:$TAG"
          echo "Image: $IMAGE"
          echo "Family: $TASK_FAMILY"
          echo "Container: $CONTAINER_NAME"

          CURRENT=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition')

          # Match the target container by name (not index) so adding a sidecar
          # later won't silently update the wrong container.
          if ! echo "$CURRENT" | jq -e --arg n "$CONTAINER_NAME" \
              'any(.containerDefinitions[]; .name == $n)' > /dev/null; then
            echo "ERROR: container '$CONTAINER_NAME' not found in task definition '$TASK_FAMILY'"
            echo "$CURRENT" | jq '.containerDefinitions | map(.name)'
            exit 1
          fi

          NEW_DEF=$(echo "$CURRENT" | jq \
            --arg img "$IMAGE" \
            --arg name "$CONTAINER_NAME" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .placementConstraints, .compatibilities, .registeredAt, .registeredBy) |
             .containerDefinitions |= map(if .name == $name then .image = $img else . end)')

          # Defence in depth: verify the patched JSON before submitting.
          PATCHED_IMAGE=$(echo "$NEW_DEF" | jq -r --arg n "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $n) | .image')
          if [ -z "$PATCHED_IMAGE" ] || [ "$PATCHED_IMAGE" = "null" ]; then
            echo "ERROR: patched task definition has empty image for container '$CONTAINER_NAME'"
            exit 1
          fi
          echo "Patched image: $PATCHED_IMAGE"

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered: $NEW_ARN"

      - name: Run database migrations
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          TASK_DEF: ${{ steps.task-def.outputs.arn }}
          CONTAINER_NAME: app
          SUBNETS: ${{ secrets.ECS_SUBNETS }}
          SECURITY_GROUPS: ${{ secrets.ECS_SECURITY_GROUPS }}
        run: |
          set -euo pipefail
          : "${CLUSTER:?ECS_CLUSTER secret is not set}"
          : "${SUBNETS:?ECS_SUBNETS secret is not set}"
          : "${SECURITY_GROUPS:?ECS_SECURITY_GROUPS secret is not set}"

          OVERRIDES=$(jq -nc --arg name "$CONTAINER_NAME" \
            '{containerOverrides:[{name:$name, command:["node","node_modules/prisma/build/index.js","migrate","deploy"]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=ENABLED}" \
            --overrides "$OVERRIDES" \
            --query "tasks[0].taskArn" --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ERROR: failed to start migration task"
            exit 1
          fi
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          DESC=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN")
          EXIT=$(echo "$DESC" | jq -r --arg n "$CONTAINER_NAME" \
            '.tasks[0].containers[] | select(.name == $n) | .exitCode // empty')
          STOP_REASON=$(echo "$DESC" | jq -r '.tasks[0].stoppedReason // ""')
          CONTAINER_REASON=$(echo "$DESC" | jq -r --arg n "$CONTAINER_NAME" \
            '.tasks[0].containers[] | select(.name == $n) | .reason // ""')

          if [ "${EXIT:-}" != "0" ]; then
            echo "ERROR: migration container exited with code '${EXIT:-<none>}'"
            [ -n "$STOP_REASON" ] && echo "Task stoppedReason: $STOP_REASON"
            [ -n "$CONTAINER_REASON" ] && echo "Container reason: $CONTAINER_REASON"
            echo "Inspect logs in CloudWatch for task: $TASK_ARN"
            exit 1
          fi
          echo "Migrations complete"

      - name: Deploy new image
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
          TASK_DEF: ${{ steps.task-def.outputs.arn }}
        run: |
          set -euo pipefail
          : "${CLUSTER:?ECS_CLUSTER secret is not set}"
          : "${SERVICE:?ECS_SERVICE secret is not set}"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$TASK_DEF" \
            --force-new-deployment > /dev/null

          if ! aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "ERROR: service did not reach a stable state in time"
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].deployments' --output json
            exit 1
          fi

          PRIMARY=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`] | [0]' --output json)
          ROLLOUT=$(echo "$PRIMARY" | jq -r '.rolloutState // "UNKNOWN"')
          if [ "$ROLLOUT" != "COMPLETED" ]; then
            echo "ERROR: primary deployment rolloutState=$ROLLOUT"
            echo "$PRIMARY"
            exit 1
          fi
          echo "Deploy complete (rolloutState=$ROLLOUT)"
