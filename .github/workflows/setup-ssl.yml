name: Setup SSL

on:
  workflow_dispatch:

jobs:
  setup-ssl:
    name: Install Nginx + Certbot on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSL via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            echo "==> Installing Nginx and Certbot..."
            sudo dnf install -y nginx python3-certbot-nginx || sudo yum install -y nginx python3-certbot-nginx

            echo "==> Configuring Nginx..."
            printf 'server {\n    listen 80;\n    server_name taskflow.skygridtech.org;\n\n    location /api/events/stream {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_set_header Connection '"'"''"'"';\n        proxy_buffering off;\n        proxy_cache off;\n        proxy_read_timeout 86400s;\n        chunked_transfer_encoding off;\n    }\n\n    location / {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection "upgrade";\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_cache_bypass $http_upgrade;\n    }\n}\n' | sudo tee /etc/nginx/conf.d/taskflow.conf > /dev/null

            echo "==> Testing Nginx config..."
            sudo nginx -t

            echo "==> Starting Nginx..."
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            echo "==> Obtaining SSL certificate..."
            sudo certbot --nginx -d taskflow.skygridtech.org --non-interactive --agree-tos --email admin@skygridtech.org --redirect

            echo "==> Setting up auto-renewal..."
            printf '0 0 1 * * root certbot renew --quiet\n' | sudo tee /etc/cron.d/certbot-renew > /dev/null

            echo "==> SSL setup complete!"
