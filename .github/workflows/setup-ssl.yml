name: Setup SSL

on:
  workflow_dispatch:

jobs:
  setup-ssl:
    name: Install Nginx + Certbot on EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install Nginx and Certbot
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            sudo dnf install -y nginx python3-certbot-nginx || sudo yum install -y nginx python3-certbot-nginx

      - name: Upload Nginx config
        run: |
          scp -i ~/.ssh/ec2_key deploy/nginx-taskflow.conf ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/nginx-taskflow.conf
          ssh -i ~/.ssh/ec2_key ec2-user@${{ secrets.EC2_HOST }} "sudo mv /home/ec2-user/nginx-taskflow.conf /etc/nginx/conf.d/taskflow.conf && sudo nginx -t && sudo systemctl enable nginx && sudo systemctl restart nginx"

      - name: Obtain SSL certificate
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            sudo certbot --nginx -d taskflow.skygridtech.org --non-interactive --agree-tos --email admin@skygridtech.org --redirect
            printf '0 0 1 * * root certbot renew --quiet\n' | sudo tee /etc/cron.d/certbot-renew > /dev/null
