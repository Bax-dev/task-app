name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock --include=optional

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.sha }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 1
          path: |
            .next/
            package.json
            ecosystem.config.js
            prisma/
            public/
            next.config.ts
            middleware.ts

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync build to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2_key" \
            build/.next/ ec2-user@${{ secrets.EC2_HOST }}:~/task-app/.next/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          envs: DATABASE_URL,JWT_SECRET,REDIS_URL,RESEND_API_KEY,EMAIL_FROM,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_GOOGLE_CLIENT_ID,GH_PAT
          script: |
            REPO_URL="https://${GH_PAT}@github.com/Bax-dev/task-app.git"

            if [ ! -d ~/task-app ]; then
              echo "==> Cloning repository..."
              git clone "$REPO_URL" ~/task-app
            fi

            cd ~/task-app

            echo "==> Configuring git remote with token..."
            git remote set-url origin "$REPO_URL"

            echo "==> Pulling latest code..."
            git stash 2>/dev/null || true
            git pull origin main

            echo "==> Writing .env file..."
            printf 'DATABASE_URL="%s"\nJWT_SECRET="%s"\nRESEND_API_KEY="%s"\nEMAIL_FROM="%s"\nREDIS_URL="%s"\nAWS_REGION="%s"\nAWS_ACCESS_KEY_ID="%s"\nAWS_SECRET_ACCESS_KEY="%s"\nAWS_S3_BUCKET="%s"\nGOOGLE_CLIENT_ID="%s"\nGOOGLE_CLIENT_SECRET="%s"\nNEXT_PUBLIC_APP_URL="%s"\nNEXT_PUBLIC_GOOGLE_CLIENT_ID="%s"\nNODE_ENV="production"\n' "${DATABASE_URL}" "${JWT_SECRET}" "${RESEND_API_KEY}" "${EMAIL_FROM}" "${REDIS_URL}" "${AWS_REGION}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" "${AWS_S3_BUCKET}" "${GOOGLE_CLIENT_ID}" "${GOOGLE_CLIENT_SECRET}" "${NEXT_PUBLIC_APP_URL}" "${NEXT_PUBLIC_GOOGLE_CLIENT_ID}" > .env

            echo "==> Configuring AWS credentials for Bedrock..."
            mkdir -p ~/.aws
            printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\nregion = %s\n' "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" "${AWS_REGION}" > ~/.aws/credentials
            printf '[default]\nregion = %s\noutput = json\n' "${AWS_REGION}" > ~/.aws/config

            if [ -z "$DATABASE_URL" ]; then
              echo "ERROR: DATABASE_URL is not set."
              exit 1
            fi

            echo "==> Installing production dependencies..."
            npm install --no-package-lock --omit=dev --include=optional

            echo "==> Generating Prisma client..."
            npx prisma generate

            echo "==> Running database migrations..."
            npx prisma migrate deploy

            echo "==> Restarting application..."
            pm2 delete taskflow 2>/dev/null || true
            pm2 start ecosystem.config.js

            echo "==> Saving PM2 process list..."
            pm2 save

            echo "==> Deploy complete!"
